<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradebook</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#e2e6ec;--ac:#2f6fed;--ok:#1a9b5b;--bad:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2b3340;--ac:#5b93ff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.badge.on{color:var(--ok)}.badge.off{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,select,button,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;width:auto}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);font-size:13px}
.chip b{margin-left:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters>*{flex:1;min-width:120px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}
td.a button{padding:4px 8px;font-size:12px;margin-left:4px}
.empty{color:var(--mu);text-align:center;padding:20px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:520px;width:92%}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📒 Gradebook</h1>
  <div><span id="mode" class="badge"></span> <span id="net" class="badge"></span> <button class="g" id="cfgBtn">Firebase settings</button></div>
</header>

<div class="card">
  <form id="f">
    <input type="hidden" id="id">
    <div><label>Date</label><input type="date" id="date" required></div>
    <div><label>Subject</label><input id="subject" list="subs" placeholder="e.g. Math" required><datalist id="subs"></datalist></div>
    <div><label>Type</label><select id="type"><option>Activity</option><option>Assignment</option><option>Quiz</option><option>Exam</option><option>Project</option><option>Recitation</option><option>Other</option></select></div>
    <div><label>Title</label><input id="title" placeholder="Optional"></div>
    <div><label>Score</label><input type="number" id="score" step="any" min="0" required></div>
    <div><label>Total items</label><input type="number" id="total" step="any" min="1" required></div>
    <div style="display:flex;gap:6px"><button id="save">Add</button><button type="button" class="g" id="cancel" hidden>Cancel</button></div>
  </form>
</div>

<div class="card"><div class="stats" id="stats"></div></div>

<div class="card">
  <div class="filters">
    <input id="q" placeholder="Search title…">
    <select id="fs"><option value="">All subjects</option></select>
    <select id="ft"><option value="">All types</option><option>Activity</option><option>Assignment</option><option>Quiz</option><option>Exam</option><option>Project</option><option>Recitation</option><option>Other</option></select>
  </div>
  <div class="tw" style="margin-top:10px"><table>
    <thead><tr><th>Date</th><th>Subject</th><th>Type</th><th>Title</th><th>Score</th><th>%</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">Firebase settings</h3>
  <p style="color:var(--mu);font-size:13px">Your project (<code>grader-b4300</code>) is built in. To switch projects, paste another <code>firebaseConfig</code> as JSON; leave empty to go back to the built-in one. Data is stored in the <code>grades</code> collection.</p>
  <textarea id="cfg" rows="8" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button class="g" id="cfgCancel">Close</button><button id="cfgSave">Save & reload</button>
  </div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[];

/* ---------- storage: Firestore (offline persistence) or localStorage ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCXvjG2kdBUs8DJ3JIF0h5RxmUDKqHKb5Y",
  authDomain: "grader-b4300.firebaseapp.com",
  projectId: "grader-b4300",
  storageBucket: "grader-b4300.firebasestorage.app",
  messagingSenderId: "216186023274",
  appId: "1:216186023274:web:61b3df4ce2e2903cc48913"
};
let cfg=firebaseConfig;try{cfg=JSON.parse(localStorage.getItem('fbcfg')||'null')||firebaseConfig}catch(e){}
let store;
if(cfg&&cfg.projectId&&window.firebase){
  firebase.initializeApp(cfg);
  const db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const col=db.collection('grades');
  store={
    name:'Firebase (offline sync on)',
    listen(cb){col.orderBy('date','desc').onSnapshot(s=>{
      cb(s.docs.map(d=>({id:d.id,...d.data()})));
      $('mode').textContent=s.metadata.hasPendingWrites?'Firebase · pending sync':s.metadata.fromCache?'Firebase · cached':'Firebase · synced';
    },e=>{$('mode').textContent='Firebase error: '+e.code})},
    // not awaited: Firestore queues the write and syncs when back online
    add(o){col.add(o).catch(console.error)},
    update(id,o){col.doc(id).set(o).catch(console.error)},
    remove(id){col.doc(id).delete().catch(console.error)}
  };
}else{
  const K='grades_local',load=()=>JSON.parse(localStorage.getItem(K)||'[]'),put=a=>{localStorage.setItem(K,JSON.stringify(a));rows=a;render()};
  store={
    name:'Local only',
    listen(cb){cb(load())},
    add(o){put([{id:Date.now().toString(36),...o},...load()])},
    update(id,o){put(load().map(r=>r.id===id?{id,...o}:r))},
    remove(id){put(load().filter(r=>r.id!==id))}
  };
  $('mode').textContent='Local only (no Firebase set)';
}

/* ---------- UI ---------- */
const pct=r=>r.total?Math.round(r.score/r.total*1000)/10:0;
function render(){
  const subs=[...new Set(rows.map(r=>r.subject))].sort();
  $('subs').innerHTML=subs.map(s=>`<option value="${esc(s)}">`).join('');
  const cur=$('fs').value;
  $('fs').innerHTML='<option value="">All subjects</option>'+subs.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('');
  const q=$('q').value.toLowerCase(),fs=$('fs').value,ft=$('ft').value;
  const list=rows.filter(r=>(!fs||r.subject===fs)&&(!ft||r.type===ft)&&(!q||(r.title||'').toLowerCase().includes(q)));
  $('rows').innerHTML=list.length?list.map(r=>{const p=pct(r);return `<tr>
    <td>${esc(r.date)}</td><td>${esc(r.subject)}</td><td>${esc(r.type)}</td><td>${esc(r.title)}</td>
    <td>${esc(r.score)} / ${esc(r.total)}</td><td style="color:var(--${p>=75?'ok':'bad'})">${p}%</td>
    <td class="a"><button class="g" onclick="edit('${r.id}')">Edit</button><button class="g" onclick="del('${r.id}')">Delete</button></td></tr>`}).join('')
    :'<tr><td colspan="7" class="empty">No records yet.</td></tr>';
  const avg=a=>a.length?Math.round(a.reduce((x,r)=>x+pct(r),0)/a.length*10)/10:0;
  $('stats').innerHTML=`<div class="chip">Overall<b>${avg(rows)}%</b></div>`+subs.map(s=>`<div class="chip">${esc(s)}<b>${avg(rows.filter(r=>r.subject===s))}%</b></div>`).join('');
}
function edit(id){
  const r=rows.find(x=>x.id===id);if(!r)return;
  ['date','subject','type','title','score','total'].forEach(k=>$(k).value=r[k]??'');
  $('id').value=id;$('save').textContent='Update';$('cancel').hidden=false;scrollTo({top:0,behavior:'smooth'});
}
function del(id){if(confirm('Delete this record?'))store.remove(id)}
function reset(){$('f').reset();$('id').value='';$('save').textContent='Add';$('cancel').hidden=true;$('date').value=new Date().toISOString().slice(0,10)}
$('cancel').onclick=reset;
$('f').onsubmit=e=>{
  e.preventDefault();
  const o={date:$('date').value,subject:$('subject').value.trim(),type:$('type').value,title:$('title').value.trim(),score:+$('score').value,total:+$('total').value};
  const id=$('id').value;id?store.update(id,o):store.add(o);reset();
};
['q','fs','ft'].forEach(i=>$(i).oninput=render);

function net(){const on=navigator.onLine;$('net').textContent=on?'Online':'Offline';$('net').className='badge '+(on?'on':'off')}
addEventListener('online',net);addEventListener('offline',net);net();

$('cfgBtn').onclick=()=>{$('cfg').value=cfg?JSON.stringify(cfg,null,2):'';$('dlg').showModal()};
$('cfgCancel').onclick=()=>$('dlg').close();
$('cfgSave').onclick=()=>{
  const v=$('cfg').value.trim();
  try{if(v){JSON.parse(v);localStorage.setItem('fbcfg',v)}else localStorage.removeItem('fbcfg');location.reload()}
  catch(e){alert('Invalid JSON')}
};

store.listen(a=>{rows=a;render()});
reset();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
